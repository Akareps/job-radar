name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q jobradar scripts
      - name: Offline test suite
        run: |
          python scripts/test_geo.py
          python scripts/test_scoring.py
          python scripts/test_text.py
          python scripts/test_db.py
          python scripts/test_lock.py
          python scripts/test_wizard.py
          python scripts/test_http.py
